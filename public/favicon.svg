<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Gradient mark, as on the title screen: an orbit, a faint inner ring, a body on the orbit and a core. -->
  <defs>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d95ff"/>
      <stop offset="0.55" stop-color="#7fe3cf"/>
      <stop offset="1" stop-color="#ffcb6b"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="url(#mk)" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="6.4" fill="none" stroke="rgba(232,228,218,.35)" stroke-width="1.2" stroke-dasharray="1.5 2.5"/>
  <circle cx="16" cy="5.5" r="2.8" fill="#ffcb6b"/>
  <circle cx="16" cy="16" r="2.6" fill="#7fe3cf"/>
</svg>
